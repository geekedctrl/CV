<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact - Karthikean Pathmanathan</title>
    <meta name="description" content="Get in touch with Karthikean Pathmanathan for collaboration and project inquiries" />
    <link rel="icon" type="image/png" href="/CV/assets/logo/KP_icon.png" />
    <link rel="stylesheet" href="/CV/assets/css/dark.css" />
    <style>html,body{background:#081024;color:#e6eef6} .container{color:inherit}</style>
    <style>
      .contact-page {
        padding: 3rem 0;
        min-height: calc(100vh - 10rem);
      }
      .contact-header {
        text-align: center;
        padding: 3rem 0 2rem;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        margin-bottom: 3rem;
      }
      .contact-header h1 {
        margin: 0 0 1rem;
        font-size: 2.5rem;
        color: var(--accent);
      }
      .contact-header p {
        color: var(--muted);
        max-width: 600px;
        margin: 0 auto;
        font-size: 1.1rem;
      }
      .contact-content {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 3rem;
        align-items: start;
      }
      .contact-info {
        background: linear-gradient(180deg,rgba(255,255,255,0.03),transparent);
        padding: 2rem;
        border-radius: var(--radius);
        border: 1px solid rgba(255,255,255,0.05);
      }
      .contact-info h3 {
        color: var(--accent);
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
      }
      .contact-methods {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .contact-method {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        background: rgba(255,255,255,0.02);
        border-radius: 8px;
        transition: all 0.2s;
      }
      .contact-method:hover {
        background: rgba(139, 92, 246, 0.1);
        transform: translateX(5px);
      }
      .contact-method-icon {
        font-size: 1.5rem;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(139, 92, 246, 0.2);
        border-radius: 8px;
      }
      .contact-method-info {
        flex: 1;
      }
      .contact-method-label {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
      }
      .contact-method-value {
        color: #e6eef6;
        font-weight: 500;
      }
      .contact-method a {
        color: var(--accent);
        text-decoration: none;
        transition: color 0.2s;
      }
      .contact-method a:hover {
        color: var(--accent-2);
        text-decoration: underline;
      }
      .contact-form-section {
        background: linear-gradient(180deg,rgba(255,255,255,0.03),transparent);
        padding: 2rem;
        border-radius: var(--radius);
        border: 1px solid rgba(255,255,255,0.05);
      }
      .contact-form-section h3 {
        color: var(--accent);
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
      }
      .contact-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .contact-form label {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .contact-form label span {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.9rem;
      }
      .contact-form input,
      .contact-form textarea {
        padding: 0.75rem 1rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        color: #e6eef6;
        font-family: inherit;
        font-size: 1rem;
        transition: all 0.2s;
      }
      .contact-form input:focus,
      .contact-form textarea:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255,255,255,0.05);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
      }
      .contact-form input::placeholder,
      .contact-form textarea::placeholder {
        color: rgba(154, 164, 178, 0.5);
      }
      .contact-form textarea {
        resize: vertical;
        min-height: 100px;
      }
      .contact-form button {
        width: 100%;
        padding: 1rem;
        font-size: 1.1rem;
      }
      .form-note {
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
        margin-top: 1rem;
      }
      @media (max-width: 820px) {
        .contact-header h1 {
          font-size: 2rem;
        }
        .contact-content {
          grid-template-columns: 1fr;
          gap: 2rem;
        }
        .contact-info,
        .contact-form-section {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- header partial will be injected here -->
    <div id="partial-header"></div>

    <main class="contact-page">

      <div class="container">
        <div class="contact-content">
          
          <!-- Contact Information -->
          <div class="contact-info">
            <h3>Contact Information</h3>
            <div class="contact-methods">
              <div class="contact-method">
                <div class="contact-method-icon">📧</div>
                <div class="contact-method-info">
                  <div class="contact-method-label">Email</div>
                  <div class="contact-method-value">
                    <a href="mailto:pkartikean@gmail.com">pkartikean@gmail.com</a>
                  </div>
                </div>
              </div>
              
              <div class="contact-method">
                <div class="contact-method-icon">📱</div>
                <div class="contact-method-info">
                  <div class="contact-method-label">Phone</div>
                  <div class="contact-method-value">
                    <a href="tel:+60122095334">+60 12-209 5334</a>
                  </div>
                </div>
              </div>
              
              <div class="contact-method">
                <div class="contact-method-icon">💼</div>
                <div class="contact-method-info">
                  <div class="contact-method-label">LinkedIn</div>
                  <div class="contact-method-value">
                    <a href="https://www.linkedin.com/in/karthikean-pathmanathan/" target="_blank">karthikean-pathmanathan</a>
                  </div>
                </div>
              </div>
              
              <div class="contact-method">
                <div class="contact-method-icon">💻</div>
                <div class="contact-method-info">
                  <div class="contact-method-label">GitHub</div>
                  <div class="contact-method-value">
                    <a href="https://github.com/madebynoturmom" target="_blank">madebynoturmom</a>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Contact Form -->
          <div class="contact-form-section">
            <h3>Send a Message</h3>
            <form action="https://formsubmit.co/pkartikean@gmail.com" method="POST" class="contact-form">
              <!-- FormSubmit Configuration -->
              <input type="hidden" name="_subject" value="New Contact Form Submission from Portfolio">
              <input type="hidden" name="_captcha" value="false">
              <input type="hidden" name="_template" value="table">
              <input type="text" name="_honey" style="display:none">
              
              <label>
                <span>Name *</span>
                <input type="text" name="name" required placeholder="Your name" />
              </label>
              
              <label>
                <span>Email *</span>
                <input type="email" name="email" required placeholder="your.email@example.com" />
              </label>
              
              <label>
                <span>Subject</span>
                <input type="text" name="subject" placeholder="What is this about?" />
              </label>
              
              <label>
                <span>Message *</span>
                <textarea name="message" required placeholder="Your message..." rows="3"></textarea>
              </label>
              
              <button class="cta" type="submit">Send Message</button>
            </form>
          </div>

        </div>
      </div>
    </main>

    <script>
      // Simple partial loader: fetches HTML fragments and injects them.
      async function loadPartial(id, url){
        try {
          const res = await fetch(url);
          if(!res.ok) throw new Error('Failed to load ' + url);
          const html = await res.text();
          document.getElementById(id).innerHTML = html;
        } catch (err) {
          console.error(err);
        }
      }
      // Load header and footer before main script runs
      loadPartial('partial-header', '../../partial/header.html');
      loadPartial('partial-footer', '../../partial/footer.html');
    </script>
  </body>
</html>
